services:
  - type: web
    name: resume-screener-api
    runtime: python
    repo: https://github.com/YOUR_USERNAME/resume-screener
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000